<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Perfect circle mask to clip your profile picture -->
    <clipPath id="circle-clip">
      <circle cx="60" cy="60" r="48" />
    </clipPath>

    <!-- The continuous spinning animation loop -->
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .rotating-gradient {
        transform-origin: 60px 60px;
        animation: spin 4s linear infinite;
      }
    </style>
  </defs>

  <!-- BACKGROUND: The rotating rainbow gradient disc -->
  <g class="rotating-gradient">
    <image width="160" height="160" x="-20" y="-20" 
           href="https://codepen.io" />
  </g>

  <!-- INNER SHIELD: Prevents the center from showing excess rainbow bleed -->
  <circle cx="60" cy="60" r="51" fill="#0d1117" />

  <!-- PROFILE PICTURE: Your profile image nested inside a safe SVG vector tag -->
  <!-- REPLACE THE HREF BELOW WITH YOUR BASE64 TEXT OR TRUStED IMAGE LINK -->
  <g clip-path="url(#circle-clip)">
    <image width="96" height="96" x="12" y="12" 
           href="https://github.com/Serenesses" />
  </g>
</svg>
