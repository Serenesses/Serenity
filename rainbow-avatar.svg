<svg xmlns="http://w3.org" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Multi-stop linear gradient mapping that mimics a rainbow spectrum -->
    <linearGradient id="rainbow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="25%" stop-color="#7a00ff" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="75%" stop-color="#00ff66" />
      <stop offset="100%" stop-color="#ffea00" />
    </linearGradient>

    <!-- Perfect circle mask to clip your profile picture shape -->
    <clipPath id="circle-clip">
      <circle cx="60" cy="60" r="46" />
    </clipPath>

    <!-- The continuous native spin animation loop configuration -->
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .rotating-gradient {
        transform-origin: 60px 60px;
        animation: spin 3s linear infinite;
      }
    </style>
  </defs>

  <!-- BACKGROUND: The rotating rainbow gradient circle layer -->
  <circle class="rotating-gradient" cx="60" cy="60" r="54" fill="url(#rainbow-grad)" />

  <!-- INNER SHIELD: Separator that matches GitHub profile card backgrounds -->
  <circle cx="60" cy="60" r="49" fill="#0d1117" />

  <!-- PROFILE PICTURE: Your profile image nested inside a safe SVG clip mask -->
  <!-- REPLACE THE HREF VALUE BELOW WITH YOUR ACCOUNT HANDLE PATH -->
  <g clip-path="url(#circle-clip)">
    <image width="92" height="92" x="14" y="14" 
           href="https://github.com/Serenesses" />
  </g>
</svg>
